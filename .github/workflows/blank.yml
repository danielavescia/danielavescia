name: Generate Snake Game SVG

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate a snake game from a GitHub user contributions grid
        uses: Platane/snk@v3
        with:
          github_user_name: danielavescia
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=7aa2f7&color_dots=#e5e9f0,#a6accd,#7aa2f7,#bb9af7,#2ac3de
      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
